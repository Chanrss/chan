<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Rich Golden Gradient -->
    <linearGradient id="ssbGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C35D" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C59A27" />
      <stop offset="100%" stop-color="#A37815" />
    </linearGradient>

    <!-- Metallic Silver Gradient -->
    <linearGradient id="ssbSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1E4EA" />
      <stop offset="35%" stop-color="#C4C7CD" />
      <stop offset="75%" stop-color="#B0B4BA" />
      <stop offset="100%" stop-color="#8E9299" />
    </linearGradient>

    <!-- Curved Wheat Stalk Branch Template -->
    <g id="ssbWheatSheaf">
      <!-- Main stem hugging outer ring -->
      <path d="M 0,0 C 50,-65 125,-120 220,-145" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="4.5" stroke-linecap="round" />
      
      <!-- Leaf Pair 1 -->
      <path d="M 10,-10 C 12,-38 28,-62 58,-72 C 54,-48 36,-26 10,-10 Z" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="4" stroke-linejoin="round" />
      <path d="M 16,-18 Q 30,-42 54,-68" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="2.5" stroke-linecap="round" />

      <path d="M 42,-44 C 54,-70 86,-92 116,-98 C 102,-74 76,-56 42,-44 Z" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="4" stroke-linejoin="round" />
      <path d="M 48,-50 Q 76,-72 110,-94" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="2.5" stroke-linecap="round" />

      <!-- Leaf Pair 2 -->
      <path d="M 72,-75 C 72,-104 98,-128 132,-134 C 122,-110 100,-88 72,-75 Z" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="4" stroke-linejoin="round" />
      <path d="M 80,-80 Q 102,-104 128,-130" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="2.5" stroke-linecap="round" />

      <path d="M 110,-102 C 130,-126 168,-144 204,-146 C 182,-124 150,-110 110,-102 Z" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="4" stroke-linejoin="round" />
      <path d="M 118,-106 Q 156,-124 198,-142" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="2.5" stroke-linecap="round" />

      <!-- Leaf Pair 3 -->
      <path d="M 145,-124 C 156,-150 190,-172 226,-174 C 210,-150 182,-132 145,-124 Z" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="4" stroke-linejoin="round" />
      <path d="M 152,-128 Q 186,-148 220,-170" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="2.5" stroke-linecap="round" />

      <!-- Tip Terminal Leaves -->
      <path d="M 188,-135 C 212,-152 254,-162 286,-160 C 262,-142 228,-134 188,-135 Z" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="4" stroke-linejoin="round" />
      <path d="M 196,-136 Q 238,-148 280,-158" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="2.5" stroke-linecap="round" />

      <!-- Small internal grain buds -->
      <path d="M 55,-35 C 46,-24 35,-19 22,-22 C 30,-30 42,-35 55,-35 Z" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="3" />
      <path d="M 118,-86 C 108,-76 95,-72 82,-76 C 92,-84 104,-88 118,-86 Z" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="3" />
    </g>

    <!-- Arc Path for Curved Text 'SRI SARAVANA BHAVAN' -->
    <path id="ssbArc" d="M 175,735 A 432,432 0 0,0 825,735" fill="none" />
  </defs>

  <!-- 1. Circular Golden Rings -->
  <circle cx="500" cy="500" r="478" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="12" />
  <circle cx="500" cy="500" r="459" fill="none" stroke="url(#ssbGoldGrad)" stroke-width="4.5" />

  <!-- 2. Wheat Laurel Branch (Top-Right) -->
  <use href="#ssbWheatSheaf" transform="translate(705, 305) rotate(12)" />

  <!-- 3. Wheat Laurel Branch (Bottom-Left, Rotated 180) -->
  <use href="#ssbWheatSheaf" transform="translate(295, 695) rotate(192)" />

  <!-- 4. Monogram 'SSB' -->
  <g id="ssbMonogramGroup">
    <!-- Left Silver 'S' -->
    <path d="
      M 390,342
      C 370,320 330,314 290,336
      C 238,365 244,432 276,472
      C 305,508 368,542 422,572
      C 475,602 485,655 455,690
      C 425,725 365,732 312,715
      C 265,700 248,662 252,624
      C 255,595 280,592 284,618
      C 288,642 308,668 344,672
      C 382,676 414,658 420,628
      C 428,590 388,560 338,530
      C 282,496 208,445 212,374
      C 216,298 285,258 358,266
      C 405,272 438,302 425,334
      C 418,348 400,352 390,342
      Z
    " fill="url(#ssbSilverGrad)" />

    <!-- Right Silver 'B' -->
    <path d="
      M 565,316
      C 565,316 630,312 680,326
      C 735,342 774,382 768,435
      C 762,482 725,510 675,518
      C 745,528 786,568 780,625
      C 772,682 715,715 635,715
      L 565,715
      Z
      M 622,364
      L 622,482
      C 652,482 696,478 705,442
      C 714,402 685,368 642,364
      Z
      M 622,536
      L 622,666
      C 658,666 712,660 718,618
      C 725,570 682,538 638,536
      Z
    " fill="url(#ssbSilverGrad)" />

    <!-- Intertwined Center Gold 'S' -->
    <path d="
      M 525,340
      C 505,320 468,314 428,336
      C 378,365 382,432 414,472
      C 445,510 505,542 560,572
      C 612,602 622,655 592,690
      C 562,725 502,732 450,715
      C 402,700 385,662 390,624
      C 394,595 418,592 422,618
      C 426,642 446,668 482,672
      C 520,676 552,658 558,628
      C 566,590 526,560 476,530
      C 420,496 348,445 352,374
      C 356,298 422,258 495,266
      C 542,272 575,302 562,334
      C 555,348 536,352 525,340
      Z
    " fill="url(#ssbGoldGrad)" />
  </g>

  <!-- 5. Arched Text 'SRI SARAVANA BHAVAN' along bottom inner rim -->
  <text font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="18" fill="url(#ssbSilverGrad)">
    <textPath href="#ssbArc" xlink:href="#ssbArc" startOffset="50%" text-anchor="middle">
      SRI SARAVANA BHAVAN
    </textPath>
  </text>
</svg>